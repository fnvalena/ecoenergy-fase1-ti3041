{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}EcoEnergy{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background-color: #f4f6f5;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tabla-scroll {
            max-height: 480px;
            overflow-y: auto;
        }
        .badge-estado {
            font-size: 0.95rem;
            padding: 0.5em 0.9em;
        }
        footer {
            color: #6c757d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1b5e3c;">
            <div class="container">
                <a class="navbar-brand" href="{% url 'zonas:listado' %}">⚡ EcoEnergy</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarPrincipal"
                    aria-controls="navbarPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir navegación"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'zonas:listado' %}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'zonas:listado' %}">Zonas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'resumen_zonas' %}">Resumen</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="container text-center py-3 border-top mt-5">
        EcoEnergy · Monitoreo energético para PyMEs · Fase 1
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
